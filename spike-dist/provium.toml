[provium]
roots = ["tests"]

# Spike: boot dist's real Peios image (prelude -> protoinit) under provium,
# with the agent injected on top of dist's initrd. Validates Option A:
# agent stays in the initramfs, real userspace lives behind prelude's chroot
# at /sysroot, and the agent can reach it.
[profiles.peios-dist]
kernel  = "/home/jack/projects/peios/dist/rootfs/boot/vmlinuz"
initrd  = "/home/jack/projects/peios/dist/build/initrd.img"
# Same as dist's `make run`, minus panic=1 so a wedge leaves a readable console.
cmdline = "console=ttyS0 loglevel=7 init=/usr/bin/protoinit"
inject_agent = true
agent_overlay_path = "/home/jack/projects/peios/provium/dist/agent-overlay.cpio.gz"
