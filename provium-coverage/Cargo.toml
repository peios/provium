[package]
name = "provium-coverage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sibling consumer of provium's observability event stream. Groups test outcomes by a metadata key (default `spec`) and emits a coverage report."

[[bin]]
name = "provium-coverage"
path = "src/main.rs"

[dependencies]
provium-protocol = { path = "../provium-protocol" }
clap = { version = "4.5", features = ["derive"] }
