[package]
name = "provium-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Guest-side agent for provium. Runs as PID 2 inside the test VM, listens on vsock, dispatches Layer-0 / Layer-1 ops on behalf of the host."

[[bin]]
name = "provium-agent"
path = "src/main.rs"

[dependencies]
provium-protocol = { path = "../provium-protocol" }

# Wire-protocol deps — the agent encodes/decodes msgpack frames itself.
serde = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }

# OS interop. `vsock` covers VsockListener / VsockStream; `libc` covers
# the few raw syscalls (kill, signal numbers) that std doesn't expose.
vsock = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
