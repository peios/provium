[workspace]
resolver = "2"
members = [
    "provium-protocol",
    "provium-qmp",
    "provium-agent",
    "provium-host",
    "provium-coverage",
]
exclude = [
    "spikes",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
serde_json = "1.0"
thiserror = "2.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
